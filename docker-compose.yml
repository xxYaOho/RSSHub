services:
    rsshub:
        build:
            context: .
            args:
                USE_CHINA_NPM_REGISTRY: 1
        ports:
            - '1200:1200'
        env_file: .env
        environment:
            # 覆盖宿主机的代理环境变量，避免 Colima Docker 内代理链路不通
            - http_proxy=
            - https_proxy=
            - HTTP_PROXY=
            - HTTPS_PROXY=
        depends_on:
            redis:
                condition: service_healthy
        restart: unless-stopped

    redis:
        image: redis:alpine
        restart: always
        volumes:
            - redis-data:/data
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 5s

volumes:
    redis-data:
